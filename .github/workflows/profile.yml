name: Refresh character sheet

on:
  schedule:
    # Weekly. These totals move slowly, and a daily commit would paint the
    # contribution graph green for no reason.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate
        env:
          # PROFILE_STATS_TOKEN is a PAT with read-only access across repos, so
          # private repositories count toward the totals. Without it the script
          # still runs, but sees public repositories only and says so.
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/build_profile.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md assets; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "chore: refresh character sheet"
          git push
