name: Publish blog

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/blog.yml"
  workflow_dispatch:

# Pages must be set to "GitHub Actions" as its build source in the repository
# settings, or the deploy step below fails with a 404.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queued runs wait rather than clobber each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4

      - name: Build
        run: zola --root docs build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
